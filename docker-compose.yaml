# nginx proxy address - http://172.17.0.1:3004

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  rallly:
    image: rallly/rallly:latest
    container_name: rallly-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - rallly
    ports:
      - "3004:3004"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./volumes/data/rallly:/data
      - ./volumes/config/rallly:/config
    depends_on:
      - rallly-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004"]
      interval: 30s
      timeout: 10s
      retries: 3

  rallly-db:
    image: postgres:16-alpine
    container_name: rallly-db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - rallly
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-rallly}
      POSTGRES_USER: ${DB_USER_NAME:-rallly}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/rallly:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${{POSTGRES_USER}} -d $${{POSTGRES_DB}}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  rallly:
    external: false
