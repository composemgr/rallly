name: rallly
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:

  app:
    image: lukevella/rallly:latest
    container_name: rallly-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: rallly-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      BASE_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      SECRET_PASSWORD: ${APP_SECRET_KEY:-replace-with-a-random-32-byte-hex-string}
      DATABASE_URL: postgresql://${DB_USER_NAME:-rallly}:${DB_USER_PASS:-replace-with-a-random-password}@db:5432/${DB_CREATE_DATABASE_NAME:-rallly}
      NEXT_PUBLIC_ENABLE_EMAIL: 'true'
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_LOGIN_NAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      EMAIL_SERVER_LOGIN_PASS: ${EMAIL_SERVER_LOGIN_PASS:-}
      EMAIL_FROM: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --noproxy ''*'' http://localhost:$${PORT}/api/status || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://rallly-app:3000'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - rallly
      - cloudflare

  db:
    image: postgres:latest
    container_name: rallly-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: rallly-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: rallly-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-rallly}
      POSTGRES_USER: ${DB_USER_NAME:-rallly}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/rallly:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER_NAME:-rallly} -d ${DB_CREATE_DATABASE_NAME:-rallly}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rallly

networks:
  rallly:
    name: rallly
    external: false
  cloudflare:
    name: cloudflare
    external: true
